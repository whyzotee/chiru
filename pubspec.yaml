name: chiru
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.4
  # cloud_firestore: ^5.4.3

  # Authentication
  google_sign_in: ^6.2.2

  # Hash Checker
  equatable: ^2.0.7

  # State Management
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6

  # Time
  whatsup: ^1.0.3

  # Sound
  just_audio: ^0.9.40

  # Connection
  connectivity_plus: ^6.0.5

  # Splash page
  flutter_native_splash: ^2.4.1

  # ENV File
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Bold.ttf
        - asset: assets/fonts/Fredoka-Light.ttf
        - asset: assets/fonts/Fredoka-Medium.ttf
        - asset: assets/fonts/Fredoka-Regular.ttf
        - asset: assets/fonts/Fredoka-SemiBold.ttf

  assets:
    - .env
    - assets/fonts/
    - assets/sounds/
    - assets/images/
    - assets/images/wp_morning/
    - assets/images/wp_afternoon/
    - assets/images/wp_evening/
    - assets/images/wp_night/
